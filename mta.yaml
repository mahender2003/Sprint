
_schema-version: 3.3.0
ID: final-sprint
version: 1.0.0
description: "Animal Adoption Tracker"

parameters:
  enable-parallel-deployments: true

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production

modules:
  - name: final-sprint-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: animaladoption-xsuaa
      - name: final-sprint-db

  - name: final-sprint-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: final-sprint-db

  - name: final-sprint
    type: approuter.nodejs
    path: .deploy/app-router
    parameters:
      keep-existing-routes: true
      disk-quota: 256M
      memory: 256M
    requires:
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true
      - name: animaladoption-xsuaa
    provides:
      - name: app-api
        properties:
          app-protocol: ${protocol}
          app-uri: ${default-uri}

resources:
  - name: animaladoption-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: animaladoption
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509
          redirect-uris:
            - https://*~{app-api/app-uri}/**
        role-collections:
          - name: 'Admin (final-sprint ${org}-${space})'
            description: 'Administrator access'
            role-template-references:
              - '$XSAPPNAME.Admin'
          - name: 'User (final-sprint ${org}-${space})'
            description: 'Animal adoption user access'
            role-template-references:
              - '$XSAPPNAME.User'
    requires:
      - name: app-api

  - name: final-sprint-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
